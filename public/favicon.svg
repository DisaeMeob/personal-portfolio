<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Subtle minimalist container -->
  <rect width="32" height="32" rx="6" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1.5" />
  
  <!-- Terminal Prompt: >_ -->
  <!-- Greater-than arrow: > -->
  <path d="M7 10L14 16L7 22" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Underscore cursor: _ -->
  <path d="M16 22H24" stroke="#171717" stroke-width="2.5" stroke-linecap="round" />
</svg>
